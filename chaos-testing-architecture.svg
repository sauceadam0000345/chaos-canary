<svg width="1200" height="800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" 
      refX="10" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#2c3e50" />
    </marker>
    <linearGradient id="deviceGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3498db;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2980b9;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="proxyGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#e74c3c;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#c0392b;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="tunnelGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#9b59b6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#8e44ad;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="1200" height="800" fill="#f8f9fa"/>
  
  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" font-family="Arial, sans-serif" font-size="24" font-weight="bold" fill="#2c3e50">
    Chaos Testing Engine Architecture
  </text>
  <text x="600" y="55" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#7f8c8d">
    Real Device Testing with Programmable Network Chaos via mitmproxy
  </text>
  
  <!-- Local Environment Box -->
  <rect x="50" y="100" width="280" height="640" fill="none" stroke="#34495e" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="190" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#34495e">
    Local Development Environment
  </text>
  
  <!-- Sauce Labs Cloud Box -->
  <rect x="400" y="100" width="350" height="640" fill="none" stroke="#3498db" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="575" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#3498db">
    Sauce Labs Cloud Infrastructure
  </text>
  
  <!-- Backend Environment Box -->
  <rect x="820" y="100" width="280" height="640" fill="none" stroke="#27ae60" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="960" y="125" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="#27ae60">
    Backend Environment
  </text>
  
  <!-- 1. saucectl Test Runner -->
  <rect x="80" y="160" width="220" height="80" rx="10" fill="#3498db" stroke="#2980b9" stroke-width="2"/>
  <text x="190" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    saucectl Test Runner
  </text>
  <text x="190" y="210" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Orchestrates test execution
  </text>
  <text x="190" y="225" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Uploads test payload to app storage
  </text>
  
  <!-- 2. Docker Container with mitmproxy -->
  <rect x="80" y="280" width="220" height="120" rx="10" fill="url(#proxyGradient)" stroke="#c0392b" stroke-width="2"/>
  <text x="190" y="310" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Docker Container
  </text>
  <text x="190" y="330" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
    mitmproxy (Chaos Engine)
  </text>
  <text x="190" y="350" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Network latency injection
  </text>
  <text x="190" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Connection termination
  </text>
  <text x="190" y="380" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Packet loss simulation
  </text>
  <text x="190" y="395" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="white">
    • Response tampering
  </text>
  
  <!-- 3. Sauce Connect Tunnel Client -->
  <rect x="80" y="440" width="220" height="80" rx="10" fill="url(#tunnelGradient)" stroke="#8e44ad" stroke-width="2"/>
  <text x="190" y="470" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Sauce Connect Tunnel
  </text>
  <text x="190" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Secure outbound-only tunnel
  </text>
  <text x="190" y="505" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • TLS-encrypted HTTP/2 connection
  </text>
  
  <!-- 4. Sauce Labs Real Device -->
  <rect x="430" y="250" width="290" height="150" rx="15" fill="url(#deviceGradient)" stroke="#2980b9" stroke-width="3"/>
  <text x="575" y="280" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" font-weight="bold" fill="white">
    Sauce Labs Real Device
  </text>
  <text x="575" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" fill="white">
    iPhone 15 Pro / Samsung Galaxy S24
  </text>
  
  <!-- Mobile App in Device -->
  <rect x="450" y="320" width="250" height="60" rx="8" fill="white" stroke="#34495e" stroke-width="1"/>
  <text x="575" y="345" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#2c3e50">
    Mobile App Under Test
  </text>
  <text x="575" y="365" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" fill="#7f8c8d">
    Running automated test scenarios
  </text>
  
  <!-- 5. Sauce Connect Server -->
  <rect x="430" y="460" width="290" height="80" rx="10" fill="#9b59b6" stroke="#8e44ad" stroke-width="2"/>
  <text x="575" y="490" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Sauce Connect Server
  </text>
  <text x="575" y="510" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Tunnel endpoint in Sauce Labs cloud
  </text>
  <text x="575" y="525" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Routes device traffic through tunnel
  </text>
  
  <!-- 6. Backend Server -->
  <rect x="850" y="320" width="220" height="100" rx="10" fill="#27ae60" stroke="#229954" stroke-width="2"/>
  <text x="960" y="355" text-anchor="middle" font-family="Arial, sans-serif" font-size="14" font-weight="bold" fill="white">
    Backend Server / API
  </text>
  <text x="960" y="375" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Production-like environment
  </text>
  <text x="960" y="390" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Application endpoints
  </text>
  <text x="960" y="405" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" fill="white">
    • Database connections
  </text>
  
  <!-- Data Flow Arrows -->
  
  <!-- 1. saucectl to Real Device -->
  <path d="M 300 200 Q 365 200 430 280" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="365" y="230" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    1. Deploy &amp; Execute Tests
  </text>
  
  <!-- 2. Real Device to Sauce Connect Server -->
  <path d="M 575 400 L 575 460" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="620" y="435" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    2. HTTP Requests
  </text>
  
  <!-- 3. Sauce Connect Server to Tunnel Client -->
  <path d="M 430 500 Q 365 500 300 480" fill="none" stroke="#9b59b6" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="365" y="515" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#9b59b6">
    3. Tunnel Connection
  </text>
  
  <!-- 4. Tunnel to mitmproxy -->
  <path d="M 190 440 L 190 400" fill="none" stroke="#2c3e50" stroke-width="3" marker-end="url(#arrowhead)"/>
  <text x="240" y="425" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#2c3e50">
    4. Proxy Traffic
  </text>
  
  <!-- 5. mitmproxy to Backend -->
  <path d="M 300 340 Q 575 250 850 370" fill="none" stroke="#e74c3c" stroke-width="4" marker-end="url(#arrowhead)" stroke-dasharray="10,5"/>
  <text x="575" y="200" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#e74c3c">
    5. Modified/Chaotic Network Traffic
  </text>
  
  <!-- Chaos Behaviors Box -->
  <rect x="80" y="570" width="220" height="150" rx="10" fill="#f39c12" stroke="#e67e22" stroke-width="2"/>
  <text x="190" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
    Chaos Behaviors Available
  </text>
  <text x="90" y="615" font-family="Arial, sans-serif" font-size="11" fill="white">• Network latency (50ms-5000ms)</text>
  <text x="90" y="630" font-family="Arial, sans-serif" font-size="11" fill="white">• Connection timeouts</text>
  <text x="90" y="645" font-family="Arial, sans-serif" font-size="11" fill="white">• HTTP status code injection</text>
  <text x="90" y="660" font-family="Arial, sans-serif" font-size="11" fill="white">• Packet loss simulation</text>
  <text x="90" y="675" font-family="Arial, sans-serif" font-size="11" fill="white">• SSL/TLS handshake failures</text>
  <text x="90" y="690" font-family="Arial, sans-serif" font-size="11" fill="white">• Response body modification</text>
  <text x="90" y="705" font-family="Arial, sans-serif" font-size="11" fill="white">• DNS resolution delays</text>
  
  <!-- Key Benefits Box -->
  <rect x="430" y="570" width="290" height="150" rx="10" fill="#16a085" stroke="#138d75" stroke-width="2"/>
  <text x="575" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
    Testing Benefits
  </text>
  <text x="440" y="615" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Real device behavior under network stress</text>
  <text x="440" y="630" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Mobile app resilience validation</text>
  <text x="440" y="645" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Realistic user experience testing</text>
  <text x="440" y="660" font-family="Arial, sans-serif" font-size="11" fill="white">✓ API retry logic verification</text>
  <text x="440" y="675" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Offline mode functionality</text>
  <text x="440" y="690" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Error handling robustness</text>
  <text x="440" y="705" font-family="Arial, sans-serif" font-size="11" fill="white">✓ Performance under adverse conditions</text>
  
  <!-- Technical Implementation Box -->
  <rect x="850" y="570" width="220" height="150" rx="10" fill="#8e44ad" stroke="#7d3c98" stroke-width="2"/>
  <text x="960" y="595" text-anchor="middle" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="white">
    Implementation Notes
  </text>
  <text x="860" y="615" font-family="Arial, sans-serif" font-size="11" fill="white">• mitmproxy addons for chaos</text>
  <text x="860" y="630" font-family="Arial, sans-serif" font-size="11" fill="white">• Docker container isolation</text>
  <text x="860" y="645" font-family="Arial, sans-serif" font-size="11" fill="white">• Sauce Connect --proxy config</text>
  <text x="860" y="660" font-family="Arial, sans-serif" font-size="11" fill="white">• TLS certificate management</text>
  <text x="860" y="675" font-family="Arial, sans-serif" font-size="11" fill="white">• Programmable chaos scripts</text>
  <text x="860" y="690" font-family="Arial, sans-serif" font-size="11" fill="white">• Real-time traffic monitoring</text>
  <text x="860" y="705" font-family="Arial, sans-serif" font-size="11" fill="white">• Test result correlation</text>
  
  <!-- Flow Legend -->
  <rect x="50" y="760" width="1100" height="30" fill="#ecf0f1" stroke="#bdc3c7" stroke-width="1"/>
  <text x="60" y="780" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="#2c3e50">
    Data Flow: 1) saucectl deploys test → 2) Real device makes HTTP requests → 3) Requests route through Sauce Connect tunnel → 4) Traffic passes through mitmproxy → 5) Chaotic traffic reaches backend
  </text>
</svg>
