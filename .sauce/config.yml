apiVersion: v1alpha
kind: xcuitest

sauce:
  region: us-west-1
  tunnel:
    name: "chaos-tunnel"
  metadata:
    build: "iOS Interactive Canary Test"

xcuitest:
  app: build/Build/Products/Debug-iphoneos/ChaosCanary.app
  testApp: build/Build/Products/Debug-iphoneos/ChaosCanaryUITests-Runner.app

suites:
  - name: "Interactive Happy Path Suite"
    # This filter ensures ONLY our new network test runs.
    testOptions:
      class:
        - ChaosCanaryUITests.InteractiveUITests
    devices:
      - name: "iPhone.*"

