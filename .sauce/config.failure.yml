# .sauce/config.failure.yml
apiVersion: v1alpha
kind: xcuitest

sauce:
  region: us-west-1
  tunnel:
    name: "chaos-tunnel-failure"
  metadata:
    build: "API Failure Chaos Experiment"

xcuitest:
  app: build/Build/Products/Debug-iphoneos/ChaosCanary.app
  testApp: build/Build/Products/Debug-iphoneos/ChaosCanaryUITests-Runner.app

suites:
  - name: "API Failure Chaos Suite"
    testOptions:
      class:
        - ChaosCanaryUITests.InteractiveUITests/testApiFailureChaosExperiment
    devices:
      - name: "iPhone.*"
