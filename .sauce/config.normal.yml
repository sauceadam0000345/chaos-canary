# .sauce/config.normal.yml
apiVersion: v1alpha
kind: xcuitest

sauce:
  region: us-west-1
  tunnel:
    name: "chaos-tunnel-normal"
  metadata:
    build: "Normal Proxy Baseline Test"

xcuitest:
  app: build/Build/Products/Debug-iphoneos/ChaosCanary.app
  testApp: build/Build/Products/Debug-iphoneos/ChaosCanaryUITests-Runner.app

suites:
  - name: "Normal Proxy Baseline Suite"
    testOptions:
      class:
        - ChaosCanaryUITests.InteractiveUITests/testHappyPathNetworkRequest
    devices:
      - name: "iPhone.*"
